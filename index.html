<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Días Libres</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1e40af;
            --primary-light: #3b82f6;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #f59e0b;
            --gray-light: #f3f4f6;
            --gray-dark: #374151;
            --border: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--gray-light);
            color: var(--gray-dark);
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
            background: white;
            min-height: 100vh;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            background: var(--primary);
            color: white;
            transition: all 0.3s;
        }

        .btn:hover {
            background: var(--primary-light);
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid var(--danger);
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            border-left: 4px solid var(--success);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Solicitud de Días Libres</h1>
            <p>Estrellla Galicia</p>
        </header>

        <div id="alerta"></div>

        <div class="form-group">
            <label>Selecciona tu nombre:</label>
            <select id="trabajador-select">
                <option value="">-- Cargando trabajadores --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Tipo de ausencia:</label>
            <select id="tipo-ausencia">
                <option value="Días Libres">Días Libres</option>
                <option value="Asunto Personal">Asunto Personal</option>
                <option value="Compensación">Compensación</option>
            </select>
        </div>

        <div class="form-group">
            <label>Fecha de inicio:</label>
            <input type="date" id="fecha-inicio">
        </div>

        <div class="form-group">
            <label>Fecha de fin:</label>
            <input type="date" id="fecha-fin">
        </div>

        <div class="form-group">
            <label>Comentarios (opcional):</label>
            <textarea id="comentario" placeholder="Escribe aquí..."></textarea>
        </div>

        <button class="btn" onclick="enviarSolicitud()">Enviar Solicitud</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://iujjnaloajvbfuajnrjk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_0xQo9qxEXoMcQvjNwAmbGA_CicppUNk';

        async function fetchSupabase(tabla, metodo = 'GET', datos = null) {
            const url = `${SUPABASE_URL}/rest/v1/${tabla}`;
            const opciones = {
                method: metodo,
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                }
            };

            if (datos) {
                opciones.body = JSON.stringify(datos);
            }

            try {
                const response = await fetch(url, opciones);
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }
                return await response.json();
            } catch (error) {
                console.error('Error Supabase:', error);
                throw error;
            }
        }

        async function cargarTrabajadores() {
            try {
                const trabajadores = await fetchSupabase('trabajadores?order=nombre');
                const select = document.getElementById('trabajador-select');
                select.innerHTML = '<option value="">-- Selecciona tu nombre --</option>';
                
                trabajadores.forEach(t => {
                    const option = document.createElement('option');
                    option.value = t.id;
                    option.textContent = t.nombre;
                    option.dataset.email = t.email;
                    select.appendChild(option);
                });
            } catch (error) {
                mostrarAlerta('❌ Error cargando trabajadores: ' + error.message, 'error');
            }
        }

        function mostrarAlerta(mensaje, tipo) {
            const alerta = document.getElementById('alerta');
            alerta.innerHTML = `<div class="alert alert-${tipo}">${mensaje}</div>`;
            setTimeout(() => {
                alerta.innerHTML = '';
            }, 5000);
        }

        async function enviarSolicitud() {
            const select = document.getElementById('trabajador-select');
            const trabajadorId = select.value;
            const trabajadorNombre = select.options[select.selectedIndex].textContent;
            const trabajadorEmail = select.options[select.selectedIndex].dataset.email;
            const tipoAusencia = document.getElementById('tipo-ausencia').value;
            const fechaInicio = document.getElementById('fecha-inicio').value;
            const fechaFin = document.getElementById('fecha-fin').value;
            const comentario = document.getElementById('comentario').value;

            if (!trabajadorId || !fechaInicio || !fechaFin) {
                mostrarAlerta('❌ Completa todos los campos obligatorios', 'error');
                return;
            }

            try {
                const solicitud = {
                    trabajador_id: parseInt(trabajadorId),
                    trabajador_nombre: trabajadorNombre,
                    email_trabajador: trabajadorEmail,
                    tipo_ausencia: tipoAusencia,
                    fecha_inicio: fechaInicio,
                    fecha_fin: fechaFin,
                    dias_laborables: calcularDias(fechaInicio, fechaFin),
                    comentario: comentario || null,
                    estado: 'Pendiente'
                };

                await fetchSupabase('solicitudes', 'POST', solicitud);
                
                mostrarAlerta('✅ Solicitud enviada correctamente', 'success');
                document.getElementById('tipo-ausencia').value = 'Días Libres';
                document.getElementById('fecha-inicio').value = '';
                document.getElementById('fecha-fin').value = '';
                document.getElementById('comentario').value = '';
            } catch (error) {
                mostrarAlerta('❌ Error al enviar solicitud: ' + error.message, 'error');
            }
        }

        function calcularDias(inicio, fin) {
            const start = new Date(inicio);
            const end = new Date(fin);
            let count = 0;
            
            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                const dayOfWeek = d.getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                    count++;
                }
            }
            return count;
        }

        // Cargar trabajadores al iniciar
        cargarTrabajadores();
    </script>
</body>
</html>
