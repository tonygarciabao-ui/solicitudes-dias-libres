<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Días Libres</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1e40af;
            --primary-light: #3b82f6;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #f59e0b;
            --gray-light: #f3f4f6;
            --gray-dark: #374151;
            --border: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--gray-light);
            color: var(--gray-dark);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
            background: white;
            min-height: 100vh;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }

        .tab-btn {
            padding: 10px 15px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: var(--gray-dark);
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            background: var(--primary);
            color: white;
            transition: all 0.3s;
        }

        .btn:hover {
            background: var(--primary-light);
        }

        .btn-small {
            width: auto;
            padding: 6px 12px;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-danger:hover {
            background: #991b1b;
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            border-left: 4px solid var(--success);
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid var(--danger);
        }

        .item-card {
            background: var(--gray-light);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info {
            flex: 1;
        }

        .item-info strong {
            display: block;
            margin-bottom: 3px;
        }

        .item-info small {
            color: #999;
            font-size: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            padding: 15px;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 25px;
            max-width: 400px;
            width: 100%;
        }

        .modal h2 {
            margin-bottom: 15px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Solicitud de Días Libres</h1>
            <p>Estrellla Galicia</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="cambiarTab('solicitar')">Nueva Solicitud</button>
            <button class="tab-btn" onclick="cambiarTab('admin')">⚙️ Admin</button>
        </div>

        <!-- TAB: SOLICITAR -->
        <div id="tab-solicitar" class="tab-content active">
            <div id="alerta"></div>

            <div class="form-group">
                <label>Selecciona tu nombre:</label>
                <select id="trabajador-select">
                    <option value="">-- Cargando --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tipo de ausencia:</label>
                <select id="tipo-ausencia">
                    <option value="Días Libres">Días Libres</option>
                    <option value="Asunto Personal">Asunto Personal</option>
                    <option value="Compensación">Compensación</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fecha de inicio:</label>
                <input type="date" id="fecha-inicio">
            </div>

            <div class="form-group">
                <label>Fecha de fin:</label>
                <input type="date" id="fecha-fin">
            </div>

            <div class="form-group">
                <label>Comentarios (opcional):</label>
                <textarea id="comentario" placeholder="Escribe aquí..."></textarea>
            </div>

            <button class="btn" onclick="enviarSolicitud()">Enviar Solicitud</button>
        </div>

        <!-- TAB: ADMIN -->
        <div id="tab-admin" class="tab-content">
            <div id="admin-content" style="display: none;">
                <h2 style="margin-bottom: 15px; font-size: 18px;">⚙️ Panel de Administrador</h2>

                <div style="margin-bottom: 30px;">
                    <h3 style="margin-bottom: 10px; font-size: 16px;">👥 Trabajadores (Total: <span id="total-trabajadores">0</span>)</h3>
                    <button class="btn btn-small" onclick="mostrarModalTrabajador()">+ Añadir Trabajador</button>
                    <div id="lista-trabajadores" style="margin-top: 15px;"></div>
                </div>

                <div style="margin-bottom: 30px;">
                    <h3 style="margin-bottom: 10px; font-size: 16px;">🗓️ Festivos (Total: <span id="total-festivos">0</span>)</h3>
                    <button class="btn btn-small" onclick="mostrarModalFestivo()">+ Añadir Festivo</button>
                    <div id="lista-festivos" style="margin-top: 15px;"></div>
                </div>

                <div style="border-top: 1px solid var(--border); padding-top: 20px;">
                    <h3 style="margin-bottom: 10px; font-size: 14px;">💾 Backup</h3>
                    <button class="btn btn-small" onclick="descargarJSON()">Descargar JSON</button>
                    <p style="font-size: 12px; color: #666; margin-top: 10px;">Descarga los datos para actualizar en GitHub manualmente.</p>
                </div>
            </div>

            <div id="admin-login" style="text-align: center;">
                <p style="margin-bottom: 15px; font-size: 14px;">🔐 Panel de Administrador</p>
                <div class="form-group">
                    <label>Introduce PIN:</label>
                    <input type="password" id="admin-pin" placeholder="****">
                </div>
                <button class="btn" onclick="verificarPIN()">Entrar</button>
            </div>
        </div>
    </div>

    <!-- MODAL TRABAJADOR -->
    <div id="modal-trabajador" class="modal">
        <div class="modal-content">
            <h2>Añadir Trabajador</h2>
            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" id="input-nombre-trab" placeholder="Nombre completo">
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="input-email-trab" placeholder="email@empresa.com">
            </div>
            <div class="form-group">
                <label>Departamento:</label>
                <input type="text" id="input-depto-trab" placeholder="Departamento">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn" style="flex: 1;" onclick="guardarTrabajador()">Guardar</button>
                <button class="btn" style="flex: 1; background: #999;" onclick="cerrarModal('modal-trabajador')">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL FESTIVO -->
    <div id="modal-festivo" class="modal">
        <div class="modal-content">
            <h2>Añadir Festivo</h2>
            <div class="form-group">
                <label>Fecha:</label>
                <input type="date" id="input-fecha-fest">
            </div>
            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" id="input-nombre-fest" placeholder="Ej: Día de Reyes">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn" style="flex: 1;" onclick="guardarFestivo()">Guardar</button>
                <button class="btn" style="flex: 1; background: #999;" onclick="cerrarModal('modal-festivo')">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // PIN admin (CAMBIA ESTO POR SEGURIDAD)
        const PIN_ADMIN = '1234';
        const URL_DATOS = 'https://raw.githubusercontent.com/tonygarciabao-ui/solicitudes-dias-libres/main/datos.json';

        let datos = {
            trabajadores: [],
            festivos: []
        };

        // Cargar datos
        async function cargarDatos() {
            try {
                const response = await fetch(URL_DATOS);
                if (response.ok) {
                    datos = await response.json();
                    actualizarTrabajadores();
                } else {
                    console.log('Usando datos locales (JSON no encontrado)');
                    // Usa datos vacíos o por defecto
                }
            } catch (error) {
                console.log('Error cargando JSON, usando localStorage:', error);
                const datosGuardados = localStorage.getItem('datos-solicitudes');
                if (datosGuardados) {
                    datos = JSON.parse(datosGuardados);
                    actualizarTrabajadores();
                }
            }
        }

        function actualizarTrabajadores() {
            const select = document.getElementById('trabajador-select');
            select.innerHTML = '<option value="">-- Selecciona tu nombre --</option>';
            
            datos.trabajadores.sort((a, b) => a.nombre.localeCompare(b.nombre)).forEach(t => {
                const option = document.createElement('option');
                option.value = t.id;
                option.textContent = t.nombre;
                option.dataset.email = t.email;
                select.appendChild(option);
            });

            // Actualizar admin
            document.getElementById('total-trabajadores').textContent = datos.trabajadores.length;
            actualizarListaTrabajadores();
            actualizarListaFestivos();
        }

        function cambiarTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById('tab-' + tab).classList.add('active');
            event.target.classList.add('active');
        }

        function verificarPIN() {
            const pin = document.getElementById('admin-pin').value;
            if (pin === PIN_ADMIN) {
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                actualizarListaTrabajadores();
                actualizarListaFestivos();
            } else {
                alert('❌ PIN incorrecto');
                document.getElementById('admin-pin').value = '';
            }
        }

        function mostrarModalTrabajador() {
            document.getElementById('modal-trabajador').classList.add('active');
        }

        function mostrarModalFestivo() {
            document.getElementById('modal-festivo').classList.add('active');
        }

        function cerrarModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function guardarTrabajador() {
            const nombre = document.getElementById('input-nombre-trab').value;
            const email = document.getElementById('input-email-trab').value;
            const depto = document.getElementById('input-depto-trab').value;

            if (!nombre || !email) {
                alert('❌ Completa todos los campos');
                return;
            }

            const id = Math.max(...datos.trabajadores.map(t => t.id), 0) + 1;
            datos.trabajadores.push({
                id,
                nombre,
                email,
                departamento: depto || 'Expediciones'
            });

            guardarLocalmente();
            document.getElementById('input-nombre-trab').value = '';
            document.getElementById('input-email-trab').value = '';
            document.getElementById('input-depto-trab').value = '';
            cerrarModal('modal-trabajador');
            actualizarTrabajadores();
            alert('✅ Trabajador añadido');
        }

        function guardarFestivo() {
            const fecha = document.getElementById('input-fecha-fest').value;
            const nombre = document.getElementById('input-nombre-fest').value;

            if (!fecha || !nombre) {
                alert('❌ Completa todos los campos');
                return;
            }

            datos.festivos.push({ fecha, nombre });
            guardarLocalmente();
            document.getElementById('input-fecha-fest').value = '';
            document.getElementById('input-nombre-fest').value = '';
            cerrarModal('modal-festivo');
            actualizarTrabajadores();
            alert('✅ Festivo añadido');
        }

        function actualizarListaTrabajadores() {
            const lista = document.getElementById('lista-trabajadores');
            lista.innerHTML = datos.trabajadores.map(t => `
                <div class="item-card">
                    <div class="item-info">
                        <strong>${t.nombre}</strong>
                        <small>${t.email}</small>
                    </div>
                    <button class="btn btn-small btn-danger" onclick="eliminarTrabajador(${t.id})">Eliminar</button>
                </div>
            `).join('');
        }

        function actualizarListaFestivos() {
            const lista = document.getElementById('lista-festivos');
            document.getElementById('total-festivos').textContent = datos.festivos.length;
            lista.innerHTML = datos.festivos.map((f, i) => `
                <div class="item-card">
                    <div class="item-info">
                        <strong>${f.nombre}</strong>
                        <small>${f.fecha}</small>
                    </div>
                    <button class="btn btn-small btn-danger" onclick="eliminarFestivo(${i})">Eliminar</button>
                </div>
            `).join('');
        }

        function eliminarTrabajador(id) {
            if (confirm('¿Eliminar este trabajador?')) {
                datos.trabajadores = datos.trabajadores.filter(t => t.id !== id);
                guardarLocalmente();
                actualizarTrabajadores();
            }
        }

        function eliminarFestivo(index) {
            if (confirm('¿Eliminar este festivo?')) {
                datos.festivos.splice(index, 1);
                guardarLocalmente();
                actualizarTrabajadores();
            }
        }

        function guardarLocalmente() {
            localStorage.setItem('datos-solicitudes', JSON.stringify(datos));
        }

        function descargarJSON() {
            const json = JSON.stringify(datos, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'datos.json';
            a.click();
        }

        function enviarSolicitud() {
            const trabajadorId = document.getElementById('trabajador-select').value;
            const fechaInicio = document.getElementById('fecha-inicio').value;
            const fechaFin = document.getElementById('fecha-fin').value;

            if (!trabajadorId || !fechaInicio || !fechaFin) {
                alert('❌ Completa todos los campos');
                return;
            }

            alert('✅ Solicitud enviada (próximamente se integrará con Power Automate)');
        }

        // Inicializar
        cargarDatos();
    </script>
</body>
</html>
